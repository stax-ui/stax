name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # pnpm delegates `publish` to `npm publish`. npm 11.5.1+ is required
      # for Trusted Publishers OIDC auth exchange (not just provenance
      # signing — that works on older npm). Node 22 ships npm 10.x. Pin to
      # npm@11 — the latest 11.x — because npm 12 dropped `--no-git-checks`
      # which changesets still passes through `pnpm publish`.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - name: Verify no package has moved off the 0.x track
        run: pnpm check-versions

      - run: pnpm build

      - run: pnpm test -- --run

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Route through the root "version" script so `pnpm sync-template-versions`
          # runs after `changeset version` — otherwise the changesets action's
          # default (bare `changeset version`) skips it and the create-stax-ui
          # templates drift out of sync with the workspace packages.
          version: pnpm run version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
